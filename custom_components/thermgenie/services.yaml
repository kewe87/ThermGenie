reset_learning:
  target:
    entity:
      integration: thermgenie
      domain: climate

set_routine:
  target:
    entity:
      integration: thermgenie
      domain: climate
  fields:
    routine:
      required: true
      selector:
        select:
          options:
            - sleep
            - wake
            - way_home
            - guard
            - cascade
            - dry
            - air
    enabled:
      required: true
      selector:
        boolean:

feel:
  target:
    entity:
      integration: thermgenie
      domain: climate
  fields:
    feeling:
      required: true
      selector:
        select:
          translation_key: feeling
          options:
            - cold
            - cool
            - good
            - warm
            - hot

set_wellbeing:
  target:
    entity:
      integration: thermgenie
      domain: climate
  fields:
    enabled:
      required: true
      selector:
        boolean:
